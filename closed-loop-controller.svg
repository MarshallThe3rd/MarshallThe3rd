<svg width="820" height="400" viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ===================== DRACULA PALETTE ===================== -->
  <!-- bg:#282a36  currentline:#44475a  fg:#f8f8f2  comment:#6272a4
       cyan:#8be9fd  green:#50fa7b  orange:#ffb86c  pink:#ff79c6
       purple:#bd93f9  red:#ff5555  yellow:#f1fa8c -->

  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="1" fill="#44475a"/>
      <rect width="1" height="16" fill="#44475a"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="820" height="400" fill="#282a36"/>
  <rect x="0" y="0" width="820" height="400" fill="url(#grid)" opacity="0.15"/>

  <!-- ===================== BASE WIRES (fully connected, single paths) ===================== -->
  <!-- equal spacing of 76px between: Sum-Controller, Controller-Plant, Plant-Turn, Turn-End -->
  <path d="M40,190 H700 M624,190 V330 H134 V190" fill="none" stroke="#44475a" stroke-width="8" stroke-linecap="square"/>
  <path d="M40,190 H700 M624,190 V330 H134 V190" fill="none" stroke="#8be9fd" stroke-width="4" stroke-linecap="square" opacity="0.55"/>

  <!-- flowing "current" overlay: continuous smooth march, not jumpy -->
  <path d="M40,190 H700 M624,190 V330 H134 V190" fill="none" stroke="#ff79c6" stroke-width="4"
        stroke-linecap="square" stroke-dasharray="10 16" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- arrowheads (pixel style), evenly placed between each block -->
  <g fill="#8be9fd">
    <rect x="160" y="186" width="10" height="8"/>
    <rect x="360" y="186" width="10" height="8"/>
    <rect x="556" y="186" width="10" height="8"/>
    <rect x="620" y="272" width="8" height="10"/>
    <rect x="130" y="196" width="8" height="10"/>
  </g>

  <!-- ===================== SUM JUNCTION ===================== -->
  <g>
    <rect x="112" y="168" width="44" height="44" fill="#21222c" stroke="#ff79c6" stroke-width="4"/>
    <text x="134" y="188" text-anchor="middle" fill="#ff79c6" font-size="20" font-weight="bold">+</text>
    <text x="134" y="204" text-anchor="middle" fill="#ff79c6" font-size="16" font-weight="bold">-</text>
  </g>

  <!-- ===================== CONTROLLER BLOCK ===================== -->
  <g>
    <rect x="232" y="150" width="120" height="80" fill="#21222c" stroke="#bd93f9" stroke-width="4"/>
    <text x="292" y="185" text-anchor="middle" fill="#f8f8f2" font-size="14" font-weight="bold">CONTROLLER</text>
    <text x="292" y="207" text-anchor="middle" fill="#6272a4" font-size="13">PID</text>
  </g>

  <!-- ===================== PLANT BLOCK (shifted right for even spacing) ===================== -->
  <g>
    <rect x="428" y="150" width="120" height="80" fill="#21222c" stroke="#bd93f9" stroke-width="4"/>
    <text x="488" y="185" text-anchor="middle" fill="#f8f8f2" font-size="14" font-weight="bold">PLANT</text>
    <text x="488" y="207" text-anchor="middle" fill="#6272a4" font-size="13">PROCESS</text>
  </g>

  <!-- ===================== SENSOR BLOCK (centered exactly on new turn point, x=624) ===================== -->
  <g>
    <rect x="564" y="280" width="120" height="50" fill="#21222c" stroke="#50fa7b" stroke-width="4"/>
    <text x="624" y="310" text-anchor="middle" fill="#50fa7b" font-size="13" font-weight="bold">SENSOR</text>
  </g>

  <!-- ===================== LABELS ===================== -->
  <text x="30" y="178" fill="#f8f8f2" font-size="13" font-weight="bold">R(s)</text>
  <text x="60" y="160" fill="#6272a4" font-size="11">setpoint</text>
  <text x="672" y="178" fill="#f8f8f2" font-size="13" font-weight="bold">Y(s)</text>
  <text x="668" y="160" fill="#6272a4" font-size="11">output</text>
  <text x="330" y="360" fill="#ff79c6" font-size="11">feedback signal</text>

  <!-- ===================== SMOOTH GLOWING SIGNAL (eased, no discrete jumps) ===================== -->
  <rect x="-5" y="-5" width="10" height="10" fill="#f1fa8c" filter="url(#glow)">
    <animateMotion
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.365;0.465;0.865;0.965;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      path="M156,190 H624 V330 H134 V190 H156" />
    <animate attributeName="opacity" values="0.85;1;0.85" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- soft trailing echo for a less-rigid, more fluid feel -->
  <rect x="-5" y="-5" width="8" height="8" fill="#50fa7b" opacity="0.5" filter="url(#glow)">
    <animateMotion
      dur="3.2s"
      begin="-0.25s"
      repeatCount="indefinite"
      calcMode="spline"
      keyTimes="0;0.365;0.465;0.865;0.965;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      path="M156,190 H624 V330 H134 V190 H156" />
  </rect>

  <!-- blinking corner pixels -->
  <g fill="#ff5555">
    <rect x="10" y="10" width="6" height="6">
      <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="804" y="10" width="6" height="6">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="384" width="6" height="6">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="804" y="384" width="6" height="6">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
