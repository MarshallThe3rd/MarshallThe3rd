<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ===================== PALETTE ===================== -->
  <!-- bg: #0d1117 (github dark) | wire: #2f81f7 | block border: #39d353 | block fill: #161b22 | accent: #ff6ac1 | text: #c9d1d9 -->

  <rect x="0" y="0" width="820" height="420" fill="#0d1117"/>

  <!-- subtle pixel grid background -->
  <g opacity="0.06">
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none"/>
      <rect width="16" height="1" fill="#39d353"/>
      <rect width="1" height="16" fill="#39d353"/>
    </pattern>
    <rect x="0" y="0" width="820" height="420" fill="url(#grid)"/>
  </g>

  <!-- ===================== TITLE ===================== -->
  <text x="410" y="34" text-anchor="middle" fill="#39d353" font-size="20" font-weight="bold" letter-spacing="2">
    CLOSED-LOOP CONTROL SYSTEM
  </text>
  <rect x="260" y="44" width="300" height="4" fill="#2f81f7"/>

  <!-- ===================== WIRES (drawn first, under blocks) ===================== -->
  <g stroke="#2f81f7" stroke-width="6" fill="none">
    <!-- R(s) input -> sum junction -->
    <path d="M 40 210 H 110" />
    <!-- sum -> controller -->
    <path d="M 150 210 H 210" />
    <!-- controller -> plant -->
    <path d="M 330 210 H 400" />
    <!-- plant -> output node -->
    <path d="M 520 210 H 620" />
    <!-- output -> Y(s) label continue -->
    <path d="M 660 210 H 730" />
    <!-- feedback: down from output tap -->
    <path d="M 660 210 V 330" />
    <!-- feedback: sensor -> left -->
    <path d="M 560 330 H 660" />
    <!-- feedback: continue left to below sum -->
    <path d="M 130 330 H 500" />
    <!-- feedback: up into sum (minus) -->
    <path d="M 130 330 V 232" />
  </g>

  <!-- pixel dashes on wires for retro feel -->
  <g fill="#58a6ff">
    <rect x="40"  y="207" width="8" height="6"/>
    <rect x="60"  y="207" width="8" height="6"/>
    <rect x="80"  y="207" width="8" height="6"/>
    <rect x="100" y="207" width="8" height="6"/>
  </g>

  <!-- ===================== ARROWHEADS (pixel style) ===================== -->
  <g fill="#58a6ff">
    <rect x="104" y="205" width="10" height="10"/>
    <rect x="204" y="205" width="10" height="10"/>
    <rect x="394" y="205" width="10" height="10"/>
    <rect x="614" y="205" width="10" height="10"/>
    <rect x="655" y="325" width="10" height="10"/>
    <rect x="125" y="325" width="10" height="10"/>
    <rect x="125" y="205" width="10" height="10"/>
  </g>

  <!-- ===================== SUM JUNCTION ===================== -->
  <g>
    <rect x="112" y="188" width="44" height="44" fill="#161b22" stroke="#39d353" stroke-width="4"/>
    <text x="134" y="216" text-anchor="middle" fill="#ff6ac1" font-size="22" font-weight="bold">+</text>
    <text x="134" y="230" text-anchor="middle" fill="#ff6ac1" font-size="18" font-weight="bold">-</text>
  </g>

  <!-- ===================== CONTROLLER BLOCK ===================== -->
  <g>
    <rect x="212" y="170" width="120" height="80" fill="#161b22" stroke="#39d353" stroke-width="4"/>
    <text x="272" y="205" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">CONTROLLER</text>
    <text x="272" y="228" text-anchor="middle" fill="#8b949e" font-size="13">PID</text>
  </g>

  <!-- ===================== PLANT BLOCK ===================== -->
  <g>
    <rect x="402" y="170" width="120" height="80" fill="#161b22" stroke="#39d353" stroke-width="4"/>
    <text x="462" y="205" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="bold">PLANT</text>
    <text x="462" y="228" text-anchor="middle" fill="#8b949e" font-size="13">PROCESS</text>
  </g>

  <!-- ===================== SENSOR BLOCK (feedback path) ===================== -->
  <g>
    <rect x="502" y="308" width="120" height="44" fill="#161b22" stroke="#ff6ac1" stroke-width="4"/>
    <text x="562" y="335" text-anchor="middle" fill="#ff6ac1" font-size="13" font-weight="bold">SENSOR</text>
  </g>

  <!-- ===================== LABELS ===================== -->
  <text x="30" y="200" fill="#c9d1d9" font-size="13" font-weight="bold">R(s)</text>
  <text x="700" y="200" fill="#c9d1d9" font-size="13" font-weight="bold">Y(s)</text>
  <text x="726" y="200" fill="#8b949e" font-size="11">output</text>
  <text x="60" y="180" fill="#8b949e" font-size="11">setpoint</text>
  <text x="120" y="360" fill="#ff6ac1" font-size="11">feedback signal</text>

  <!-- ===================== ANIMATED PIXEL SIGNAL ===================== -->
  <!-- one glowing pixel travels the whole loop, moving in discrete (stepwise) jumps for a pixel feel -->
  <rect x="0" y="0" width="12" height="12" fill="#39d353">
    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      calcMode="discrete"
      keyPoints="0;0.02;0.04;0.06;0.08;0.10;0.12;0.14;0.16;0.18;0.20;0.22;0.24;0.26;0.28;0.30;0.32;0.34;0.36;0.38;0.40;0.42;0.44;0.46;0.48;0.50;0.52;0.54;0.56;0.58;0.60;0.62;0.64;0.66;0.68;0.70;0.72;0.74;0.76;0.78;0.80;0.82;0.84;0.86;0.88;0.90;0.92;0.94;0.96;0.98;1"
      keyTimes="0;0.02;0.04;0.06;0.08;0.10;0.12;0.14;0.16;0.18;0.20;0.22;0.24;0.26;0.28;0.30;0.32;0.34;0.36;0.38;0.40;0.42;0.44;0.46;0.48;0.50;0.52;0.54;0.56;0.58;0.60;0.62;0.64;0.66;0.68;0.70;0.72;0.74;0.76;0.78;0.80;0.82;0.84;0.86;0.88;0.90;0.92;0.94;0.96;0.98;1"
      path="M 46 210
            L 134 210
            L 216 210
            L 336 210
            L 406 210
            L 526 210
            L 660 210
            L 660 330
            L 562 330
            L 130 330
            L 130 210
            L 118 210
            L 46 210" />
    <animate attributeName="opacity" values="1;0.4;1" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <!-- blinking corner pixels for retro CRT feel -->
  <g fill="#39d353">
    <rect x="10" y="10" width="6" height="6">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="804" y="10" width="6" height="6">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="404" width="6" height="6">
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="804" y="404" width="6" height="6">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
